name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you're in, not the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What did you have in mind?
  - type: checkboxes
    id: constraints
    attributes:
      label: Please confirm
      options:
        - label: I've read CONTRIBUTING.md, including the list of things that get pushed back on
          required: true
        - label: This doesn't require the app to make network calls to a third party
          required: true
